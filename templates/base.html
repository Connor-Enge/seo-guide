<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} — {site}</title>
<meta name="description" content="{description}">
<link rel="canonical" href="{canonical}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="Connor Enge">
<meta property="og:type" content="{og_type}">
<meta property="og:title" content="{title}">
<meta property="og:description" content="{description}">
<meta property="og:url" content="{canonical}">
<meta property="og:site_name" content="{site}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{title}">
<meta name="twitter:description" content="{description}">
<meta name="theme-color" content="#0b6bcb">
<link rel="icon" href="{base}/assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="{base}/site.webmanifest">
<link rel="alternate" type="application/rss+xml" title="{site} — RSS feed" href="{base}/feed.xml">
<link rel="alternate" type="application/feed+json" title="{site} — JSON feed" href="{base}/feed.json">
<link rel="stylesheet" href="{base}/assets/style.css">
<link rel="stylesheet" media="print" href="{base}/assets/print.css">
{jsonld}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site">
  <a class="brand" href="{base}/"><img class="brand-mark" src="{base}/assets/logo.svg" width="26" height="26" alt="" aria-hidden="true" decoding="async">{site}</a>
  <nav aria-label="Guide sections"><ul>{nav}</ul></nav>
  <form class="hsearch" role="search" method="get" action="{base}/search/">
    <input type="search" name="q" aria-label="Search the guide" placeholder="Search…" enterkeyhint="search" autocomplete="off">
  </form>
</header>
<main id="main" class="wrap">
  <article>
    <h1>{h1}</h1>
    <p class="meta">{byline}</p>
    {toc}
    {content}
    {pager}
  </article>
</main>
<footer class="site">
  <p>© {year} The Guide to SEO · Built as a static, no-JS, Core-Web-Vitals-first site — an SEO guide that practices what it preaches.</p>
  <p><a href="{base}/about/">About &amp; editorial standards</a> · Subscribe: <a href="{base}/feed.xml">RSS</a> · <a href="{base}/feed.json">JSON</a></p>
</footer>
{scripts}
</body>
</html>
